<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Master Ultra-Aggressive Amber Gold Metallic Gradient -->
    <linearGradient id="dkFavGold" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="14%" stop-color="#FEF08A" />
      <stop offset="38%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="88%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Contrast Drop Shadow for Light & Dark browser tabs -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <g transform="translate(1.5, 22) scale(0.76)" filter="url(#favGlow)">
    <!-- ==================== LETTER "D" ==================== -->
    <path 
      d="
        M 17 6 
        H 43 
        L 57 20 
        L 57 44 
        L 43 66 
        L 4 66 
        L 17 6 
        Z 
        M 26 19 
        L 17 53 
        L 36 53 
        L 44 42 
        L 44 29 
        L 36 19 
        Z
      " 
      fill="url(#dkFavGold)" 
      fill-rule="evenodd" 
    />

    <!-- ==================== LETTER "K" ==================== -->
    <!-- K Vertical Spine -->
    <path 
      d="
        M 65 6 
        H 79 
        L 66 66 
        H 52 
        Z
      " 
      fill="url(#dkFavGold)" 
    />

    <!-- K Upper Katana Blade -->
    <path 
      d="
        M 76 35 
        L 104 6 
        H 124 
        L 90 41 
        Z
      " 
      fill="url(#dkFavGold)" 
    />

    <!-- K Lower Power Blade -->
    <path 
      d="
        M 84 38 
        L 116 66 
        H 96 
        L 72 46 
        Z
      " 
      fill="url(#dkFavGold)" 
    />

    <!-- Embedded High-Speed Play Notch -->
    <polygon 
      points="89,38 80,32 80,44" 
      fill="#FFFFFF" 
    />

    <!-- Katana Blade Edge Specular Highlight Lines -->
    <line x1="104" y1="6" x2="124" y2="6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="17" y1="6" x2="43" y2="6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
