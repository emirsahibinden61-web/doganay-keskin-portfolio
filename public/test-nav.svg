<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 72" fill="none" class="w-full h-full drop-shadow-md">
  <defs>
    <!-- Master Ultra-Aggressive Amber Gold Metallic Gradient -->
    <linearGradient id="dkAggressiveGold" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="14%" stop-color="#FEF08A" />
      <stop offset="38%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="88%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Specular Blade Shine -->
    <linearGradient id="dkBladeShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FEF08A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Dynamic Glow -->
    <filter id="dkAggressiveGlow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#D97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#dkAggressiveGlow)">
    <!-- ==================== LETTER "D" ==================== -->
    <!-- Faceted Supercar & Video Cut Aesthetic -->
    <path 
      d="
        M 17 6 
        H 43 
        L 57 20 
        L 57 44 
        L 43 66 
        L 4 66 
        L 17 6 
        Z 
        M 26 19 
        L 17 53 
        L 36 53 
        L 44 42 
        L 44 29 
        L 36 19 
        Z
      " 
      fill="url(#dkAggressiveGold)" 
      fill-rule="evenodd" 
    />

    <!-- ==================== LETTER "K" ==================== -->
    <!-- K Vertical Slanted Spine -->
    <path 
      d="
        M 65 6 
        H 79 
        L 66 66 
        H 52 
        Z
      " 
      fill="url(#dkAggressiveGold)" 
    />

    <!-- K Upper Katana Blade -->
    <path 
      d="
        M 76 35 
        L 104 6 
        H 124 
        L 90 41 
        Z
      " 
      fill="url(#dkAggressiveGold)" 
    />

    <!-- K Lower Power Blade -->
    <path 
      d="
        M 84 38 
        L 116 66 
        H 96 
        L 72 46 
        Z
      " 
      fill="url(#dkAggressiveGold)" 
    />

    <!-- Speed Play Core Notch inside K -->
    <polygon 
      points="89,38 80,32 80,44" 
      fill="#FFFFFF" 
      opacity="0.95" 
    />

    <!-- Katana Blade Edge Specular Highlight Lines -->
    <line x1="104" y1="6" x2="124" y2="6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <line x1="17" y1="6" x2="43" y2="6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>